name: Deploy to Railway

# Railway's native GitHub auto-deploy never fired for the CLI-connected service,
# so deployment is driven from here: every push to main redeploys the Nuxt web
# service. Requires a RAILWAY_TOKEN secret — a project token for the learn-fell
# production environment.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @railway/cli
      - run: railway up --service web --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
